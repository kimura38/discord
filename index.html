<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>村サーバー Webチャット</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-tertiary: #202225; --bg-secondary: #2f3136; --bg-primary: #36393f;
      --bg-message-hover: #32353b; --text-normal: #dcddde; --text-muted: #8e9297;
      --header-primary: #ffffff; --accent: #5865F2; --accent-hover: #4752C4;
      --danger: #ed4245; --input-bg: #40444b;
    }
    * { box-sizing: border-box; }
    
    /* スマホ対応: 100dvh を追加 */
    body { margin: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background-color: var(--bg-primary); color: var(--text-normal); display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

    /* ログイン画面 */
    #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100vw; height: 100vh; height: 100dvh; background-color: var(--bg-primary); position: absolute; z-index: 100; }
    .login-box { background: var(--bg-secondary); padding: 40px; border-radius: 8px; text-align: center; width: 90%; max-width: 400px; }
    
    /* メインレイアウト */
    #app-screen { display: flex; width: 100vw; height: 100vh; height: 100dvh; position: relative; }
    
    /* サイドバー (チャンネル一覧) */
    .sidebar { width: 240px; background-color: var(--bg-secondary); display: flex; flex-direction: column; transition: left 0.3s ease; }
    .sidebar-header { height: 48px; padding: 0 16px; display: flex; align-items: center; font-weight: bold; border-bottom: 1px solid var(--bg-tertiary); box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
    .channel-list { flex-grow: 1; padding: 12px 8px; overflow-y: auto; }
    .channel-item { padding: 8px; margin-bottom: 4px; border-radius: 4px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .channel-item:hover { background-color: rgba(79,84,92,0.32); color: var(--text-normal); }
    .channel-item.active { background-color: rgba(79,84,92,0.6); color: var(--header-primary); }

    /* ユーザーパネル */
    .user-panel { background-color: #292b2f; padding: 0 8px; height: 52px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .user-info { display: flex; align-items: center; gap: 8px; cursor: pointer; flex-grow: 1; overflow: hidden; padding: 4px; border-radius: 4px; }
    .user-info:hover { background-color: rgba(79,84,92,0.32); }
    .user-info img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
    .user-text { display: flex; flex-direction: column; overflow: hidden; }
    .user-text .name { font-size: 0.9em; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--header-primary); }

    /* チャットエリア */
    .chat-container { flex-grow: 1; display: flex; flex-direction: column; background-color: var(--bg-primary); min-width: 0; }
    .chat-header { height: 48px; border-bottom: 1px solid var(--bg-tertiary); display: flex; align-items: center; padding: 0 16px; font-weight: bold; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .mobile-menu-btn { display: none; color: var(--text-normal); font-size: 1.4em; margin-right: 16px; cursor: pointer; }
    
    .chat-messages { flex-grow: 1; padding: 16px 0; overflow-y: auto; display: flex; flex-direction: column; }
    .message { display: flex; gap: 16px; padding: 4px 16px; margin-top: 12px; }
    .message:hover { background-color: var(--bg-message-hover); }
    .message img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .message-content { flex-grow: 1; display: flex; flex-direction: column; min-width: 0; }
    .message-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
    .message-header .user-name { font-weight: 500; color: var(--header-primary); }
    .message-header .timestamp { font-size: 0.75em; color: var(--text-muted); }
    .message-text { color: var(--text-normal); word-break: break-word; white-space: pre-wrap; line-height: 1.4; }
    
    /* 埋め込み(Embed)やマイクラ通知の装飾 */
    .embed-box { border-left: 4px solid var(--accent); background: rgba(0,0,0,0.15); padding: 8px 12px; margin-top: 4px; border-radius: 4px; }
    .embed-title { font-weight: bold; margin-bottom: 4px; color: var(--header-primary); }

    .chat-input-area { padding: 0 16px 24px 16px; flex-shrink: 0; }
    .chat-input-wrapper { display: flex; align-items: center; background-color: var(--input-bg); border-radius: 8px; padding: 0 16px; gap: 12px; }
    .chat-input-wrapper input { flex-grow: 1; background: transparent; border: none; color: var(--text-normal); outline: none; padding: 14px 0; font-size: 1em; }

    /* 設定モーダル */
    .settings-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh; background: rgba(0,0,0,0.7); z-index: 200; justify-content: center; align-items: center; }
    .settings-content { background: var(--bg-primary); width: 90%; max-width: 400px; padding: 24px; border-radius: 8px; }
    .settings-content h3 { margin-top: 0; color: var(--header-primary); }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 8px; font-size: 0.8em; font-weight: bold; color: var(--text-muted); }
    .form-group input[type="text"] { width: 100%; padding: 10px; background: var(--bg-tertiary); border: 1px solid #000; border-radius: 4px; color: var(--text-normal); }
    .btn-save { background: var(--accent); color: white; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 1em; }
    .btn-close { background: transparent; color: var(--text-muted); border: none; padding: 10px; cursor: pointer; width: 100%; margin-top: 8px; }

    /* --- スマホ向けUI設定 --- */
    @media (max-width: 768px) {
      .sidebar { position: fixed; left: -260px; top: 0; bottom: 0; z-index: 1000; width: 260px; box-shadow: 2px 0 5px rgba(0,0,0,0.5); }
      .sidebar.show { left: 0; }
      .mobile-menu-btn { display: inline-block !important; }
      .mobile-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh; background: rgba(0,0,0,0.6); z-index: 999; }
      .mobile-overlay.show { display: block; }
      /* iPhoneの下の線に被らないようにする魔法のコード */
      .chat-input-area { padding: 0 8px calc(12px + env(safe-area-inset-bottom)) 8px; }
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- ログイン画面 -->
  <div id="login-screen">
    <div class="login-box">
      <h2 style="color:white; margin-top:0;">村サーバーへようこそ</h2>
      <p style="color:var(--text-muted); margin-bottom:24px;">Googleでログインしてください</p>
      <div id="g_id_onload"
           data-client_id="1088837422614-mme9r7callo83q6d8uga2ga12pteftjs.apps.googleusercontent.com" 
           data-callback="handleCredentialResponse"
           data-auto_prompt="false">
      </div>
      <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-size="large"></div>
    </div>
  </div>

  <!-- 設定モーダル -->
  <div id="settings-modal" class="settings-modal">
    <div class="settings-content">
      <h3>プロフィール設定</h3>
      <div class="form-group">
        <label>表示名</label>
        <input type="text" id="custom-name" placeholder="新しい名前を入力">
      </div>
      <div class="form-group">
        <label>アイコンを変更 (画像ファイル)</label>
        <input type="file" id="custom-icon-file" accept="image/*" style="color: white; width: 100%;">
      </div>
      <button class="btn-save" onclick="saveProfile()">保存する</button>
      <button class="btn-close" onclick="closeSettings()">キャンセル</button>
    </div>
  </div>

  <!-- メイン画面 -->
  <div id="app-screen" class="hidden">
    <!-- スマホ用メニュー背景 -->
    <div id="mobile-overlay" class="mobile-overlay" onclick="toggleMenu()"></div>

    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">村サーバー</div>
      <div class="channel-list" id="channel-list">
        <!-- チャンネルは自動で読み込まれます -->
        <div style="color:var(--text-muted); text-align:center; margin-top:20px;">読込中...</div>
      </div>
      
      <div class="user-panel">
        <div class="user-info" onclick="openSettings()">
          <img id="sidebar-icon" src="">
          <div class="user-text"><span class="name" id="sidebar-name">ユーザー</span></div>
        </div>
        <button onclick="openSettings()" style="background:none; border:none; color:var(--text-muted); cursor:pointer;" title="設定"><i class="fa-solid fa-gear"></i></button>
        <button onclick="logout()" style="background:none; border:none; color:var(--danger); cursor:pointer;" title="ログアウト"><i class="fa-solid fa-right-from-bracket"></i></button>
      </div>
    </div>

    <div class="chat-container">
      <div class="chat-header">
        <i class="fa-solid fa-bars mobile-menu-btn" onclick="toggleMenu()"></i>
        <i class="fa-solid fa-hashtag" style="color:var(--text-muted); margin-right:8px;"></i>
        <span id="current-channel-title">ロード中...</span>
      </div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-area">
        <div class="chat-input-wrapper">
          <input type="text" id="message-input" placeholder="メッセージを送信" onkeypress="handleKeyPress(event)">
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let currentChannelId = null;
    let currentChannelName = "";
    let pollInterval = null;

    // --- Cookie操作 ---
    function setCookie(name, value, days) {
      const d = new Date();
      d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
      document.cookie = name + "=" + encodeURIComponent(value) + ";expires=" + d.toUTCString() + ";path=/";
    }
    function getCookie(name) {
      const cname = name + "=";
      const ca = document.cookie.split(';');
      for(let i = 0; i < ca.length; i++) {
        let c = ca[i].trim();
        if (c.indexOf(cname) == 0) return decodeURIComponent(c.substring(cname.length, c.length));
      }
      return "";
    }
    function deleteCookie(name) {
      document.cookie = name + "=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
    }

    // --- 初期化処理 ---
    window.onload = () => {
      const savedName = getCookie('discordChatName');
      const savedPic = localStorage.getItem('discordChatPic');

      if (savedName) {
        currentUser = { name: savedName, picture: savedPic || 'https://cdn.discordapp.com/embed/avatars/0.png' };
        loginSuccess();
      }
    };

    function handleCredentialResponse(response) {
      const payload = JSON.parse(decodeURIComponent(atob(response.credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
      currentUser = { name: payload.name, picture: payload.picture };
      setCookie('discordChatName', currentUser.name, 30);
      localStorage.setItem('discordChatPic', currentUser.picture);
      loginSuccess();
    }

    function loginSuccess() {
      document.getElementById('sidebar-name').textContent = currentUser.name;
      document.getElementById('sidebar-icon').src = currentUser.picture;
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');
      loadChannels();
    }

    // --- チャンネル一覧の自動取得 ---
    async function loadChannels() {
      try {
        const res = await fetch('/api/discord?action=getChannels');
        const channels = await res.json();
        
        const listDiv = document.getElementById('channel-list');
        listDiv.innerHTML = '';
        
        channels.forEach((ch, index) => {
          if (!currentChannelId && index === 0) {
            currentChannelId = ch.id;
            currentChannelName = ch.name;
          }
          const div = document.createElement('div');
          div.className = `channel-item ${ch.id === currentChannelId ? 'active' : ''}`;
          div.innerHTML = `<i class="fa-solid fa-hashtag"></i> ${ch.name}`;
          div.onclick = () => switchChannel(ch.id, ch.name);
          listDiv.appendChild(div);
        });

        if (currentChannelId) switchChannel(currentChannelId, currentChannelName);
      } catch (e) {
        document.getElementById('channel-list').innerHTML = '<div style="color:#ed4245; padding:10px;">取得エラー</div>';
      }
    }

    function switchChannel(channelId, channelName) {
      currentChannelId = channelId;
      currentChannelName = channelName;
      document.getElementById('current-channel-title').textContent = channelName;
      document.getElementById('message-input').placeholder = `# ${channelName} にメッセージを送信`;
      
      // 見た目の更新
      document.querySelectorAll('.channel-item').forEach(el => {
        el.classList.remove('active');
        if(el.innerText.trim() === channelName) el.classList.add('active');
      });

      // スマホならメニューを閉じる
      document.getElementById('sidebar').classList.remove('show');
      document.getElementById('mobile-overlay').classList.remove('show');

      document.getElementById('chat-messages').innerHTML = '';
      startPolling();
    }

    function toggleMenu() {
      document.getElementById('sidebar').classList.toggle('show');
      document.getElementById('mobile-overlay').classList.toggle('show');
    }

    // --- メッセージ処理 ---
    function startPolling() {
      fetchMessages();
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(fetchMessages, 4000);
    }

    async function fetchMessages() {
      try {
        const res = await fetch(`/api/discord?action=getMessages&channelId=${currentChannelId}`);
        if (!res.ok) return;
        const messages = await res.json();
        renderMessages(messages);
      } catch (e) {}
    }

    function renderMessages(messages) {
      const container = document.getElementById('chat-messages');
      container.innerHTML = ''; 
      
      messages.slice().reverse().forEach(msg => {
        const div = document.createElement('div');
        div.className = 'message';
        
        let avatar = 'https://cdn.discordapp.com/embed/avatars/0.png';
        if (msg.author.avatar) avatar = `https://cdn.discordapp.com/avatars/${msg.author.id}/${msg.author.avatar}.png`;
        else if (msg.author.avatar_url) avatar = msg.author.avatar_url; 
        
        const d = new Date(msg.timestamp);
        const timeStr = `${d.getMonth()+1}/${d.getDate()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;

        let textContent = escapeHtml(msg.content);

        // 特殊な埋め込みメッセージ（Embed）の解析と表示
        if (msg.embeds && msg.embeds.length > 0) {
          msg.embeds.forEach(embed => {
            let colorCode = embed.color ? '#' + embed.color.toString(16).padStart(6, '0') : 'var(--accent)';
            let embedHtml = `<div class="embed-box" style="border-left-color: ${colorCode};">`;
            if (embed.author && embed.author.name) embedHtml += `<div style="font-size:0.85em; font-weight:bold; margin-bottom:4px;">${escapeHtml(embed.author.name)}</div>`;
            if (embed.title) embedHtml += `<div class="embed-title">${escapeHtml(embed.title)}</div>`;
            if (embed.description) embedHtml += `<div>${escapeHtml(embed.description).replace(/\n/g, '<br>')}</div>`;
            embedHtml += `</div>`;
            textContent += embedHtml;
          });
        }

        div.innerHTML = `
          <img src="${avatar}">
          <div class="message-content">
            <div class="message-header">
              <span class="user-name">${escapeHtml(msg.author.username)}</span>
              <span class="timestamp">${timeStr}</span>
            </div>
            <div class="message-text">${textContent}</div>
          </div>
        `;
        container.appendChild(div);
      });
      container.scrollTop = container.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !currentUser || !currentChannelId) return;

      // APIに送信を依頼
      fetch('/api/discord', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'sendMessage',
          channelId: currentChannelId,
          username: currentUser.name,
          avatar_url: currentUser.picture,
          content: text
        })
      }).then(() => {
        input.value = '';
        setTimeout(fetchMessages, 500);
      });
    }

    function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }

    // --- プロフィール・その他 ---
    function openSettings() {
      document.getElementById('custom-name').value = currentUser.name;
      document.getElementById('settings-modal').style.display = 'flex';
      document.getElementById('sidebar').classList.remove('show');
      document.getElementById('mobile-overlay').classList.remove('show');
    }
    function closeSettings() {
      document.getElementById('settings-modal').style.display = 'none';
      document.getElementById('custom-icon-file').value = '';
    }
    function saveProfile() {
      const newName = document.getElementById('custom-name').value;
      const fileInput = document.getElementById('custom-icon-file');
      if (!newName) return alert('表示名を入力してください');
      currentUser.name = newName;
      setCookie('discordChatName', newName, 30);
      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          currentUser.picture = e.target.result;
          localStorage.setItem('discordChatPic', currentUser.picture);
          updateProfileUI();
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else updateProfileUI();
    }
    function updateProfileUI() {
      document.getElementById('sidebar-name').textContent = currentUser.name;
      document.getElementById('sidebar-icon').src = currentUser.picture;
      closeSettings();
    }
    function logout() { deleteCookie('discordChatName'); localStorage.removeItem('discordChatPic'); location.reload(); }
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&'`<>]/g, match => ({ '&': '&amp;', "'": '&#x27;', '`': '&#x60;', '<': '&lt;', '>': '&gt;' }[match]));
    }
  </script>
</body>
</html>
