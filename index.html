<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Discord Webチャット</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg-darker: #202225;
      --bg-dark: #2f3136;
      --bg-chat: #36393f;
      --text-normal: #dcddde;
      --text-muted: #8e9297;
      --accent: #7289da;
    }
    body { margin: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background-color: var(--bg-chat); color: var(--text-normal); display: flex; height: 100vh; overflow: hidden; }
    
    /* ログイン画面 */
    #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100vw; height: 100vh; background-color: var(--bg-darker); }
    
    /* メイン画面レイアウト */
    #app-screen { display: flex; width: 100vw; height: 100vh; }
    .sidebar { width: 240px; background-color: var(--bg-darker); display: flex; flex-direction: column; border-right: 1px solid #202225; }
    .channel-list { padding: 10px; flex-grow: 1; }
    .channel-item { padding: 10px; border-radius: 4px; cursor: pointer; margin-bottom: 4px; color: var(--text-muted); }
    .channel-item:hover { background-color: rgba(255,255,255,0.05); color: var(--text-normal); }
    .channel-item.active { background-color: rgba(255,255,255,0.1); color: #fff; font-weight: bold; }
    
    .chat-container { flex-grow: 1; display: flex; flex-direction: column; background-color: var(--bg-chat); }
    .chat-header { height: 50px; border-bottom: 1px solid #202225; display: flex; align-items: center; padding: 0 20px; font-weight: bold; font-size: 1.1em; }
    
    .chat-messages { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column-reverse; gap: 15px; }
    .message { display: flex; gap: 15px; }
    .message img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .message-content .user-name { font-weight: bold; margin-bottom: 4px; }
    .message-content .text { color: var(--text-normal); word-break: break-all; }
    
    .chat-input-area { padding: 20px; background-color: var(--bg-chat); }
    .chat-input-wrapper { display: flex; background-color: #40444b; border-radius: 8px; padding: 10px; }
    .chat-input-wrapper input { flex-grow: 1; background: transparent; border: none; color: white; outline: none; font-size: 1em; }
    .chat-input-wrapper button { background-color: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }

    /* ユーザー・設定パネル */
    .user-panel { padding: 10px; background-color: #292b2f; display: flex; align-items: center; justify-content: space-between; font-size: 0.9em; }
    .user-info { display: flex; align-items: center; gap: 8px; overflow: hidden; }
    .user-info img { width: 32px; height: 32px; border-radius: 50%; }
    .settings-box { padding: 10px; background-color: #2f3136; border-top: 1px solid #202225; font-size: 0.85em; }
    .settings-box input { width: 100%; padding: 5px; margin-top: 4px; margin-bottom: 8px; background: #202225; border: 1px solid #202225; color: white; border-radius: 3px; box-sizing: border-box; }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- ログイン画面 -->
  <div id="login-screen">
    <h2 style="color: white;">Discord Webチャットへようこそ</h2>
    <div id="g_id_onload"
         data-client_id="1088837422614-mme9r7callo83q6d8uga2ga12pteftjs.apps.googleusercontent.com"
         data-callback="handleCredentialResponse">
    </div>
    <div class="g_id_signin" data-type="standard"></div>
  </div>

  <!-- メイン画面（Discord風） -->
  <div id="app-screen" class="hidden">
    <!-- サイドバー -->
    <div class="sidebar">
      <div style="padding: 20px; font-weight: bold; border-bottom: 1px solid #202225;">マイサーバー</div>
      
      <!-- チャンネル一覧 (ここにチャンネルを追加・切り替え) -->
      <div class="channel-list" id="channel-list">
        <!-- チャンネルの例 1 -->
        <div class="channel-item active" onclick="switchChannel('123456789012345678', 'https://discord.com/api/webhooks/YOUR_WEBHOOK_1', 'general')">
          # 雑談チャンネル
        </div>
        <!-- チャンネルの例 2 -->
        <div class="channel-item" onclick="switchChannel('876543210987654321', 'https://discord.com/api/webhooks/YOUR_WEBHOOK_2', 'minecraft')">
          # マイクラ連携
        </div>
      </div>

      <!-- プロフィール・設定エリア -->
      <div class="settings-box">
        <div>設定: 名前</div>
        <input type="text" id="custom-name">
        <div>アイコンURL</div>
        <input type="text" id="custom-icon-url">
        <button onclick="saveProfile()" style="width:100%; background:var(--accent); color:white; border:none; padding:5px; border-radius:3px; cursor:pointer;">保存</button>
      </div>

      <div class="user-panel">
        <div class="user-info">
          <img id="sidebar-icon" src="">
          <span id="sidebar-name" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></span>
        </div>
        <button onclick="logout()" style="background:transparent; border:none; color:#ed4245; cursor:pointer;">🚪</button>
      </div>
    </div>

    <!-- チャットメイン画面 -->
    <div class="chat-container">
      <div class="chat-header" id="current-channel-title"># 雑談チャンネル</div>
      
      <!-- メッセージ表示エリア -->
      <div class="chat-messages" id="chat-messages">
        <!-- メッセージがここに動的に追加されます -->
      </div>

      <!-- 入力エリア -->
      <div class="chat-input-area">
        <div class="chat-input-wrapper">
          <input type="text" id="message-input" placeholder="# 雑談チャンネルにメッセージを送信..." onkeypress="handleKeyPress(event)">
          <button onclick="sendMessage()">送信</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;
    // 現在選択中のチャンネル情報（初期値）
    let currentChannelId = '123456789012345678'; // DiscordのチャンネルID
    let currentWebhookUrl = 'https://discord.com/api/webhooks/1538126374131208192/DBVgsnjhQ69ZVmwj1lFdgGHhtEhppOijrhsWzdqdSI2AoS9uLo6D-Kc2OMZ7N1PcJKgT'; // あなたのWebhook URL

    let pollInterval = null;

    function handleCredentialResponse(response) {
      const payload = decodeJwtResponse(response.credential);
      
      const savedName = localStorage.getItem('customName');
      const savedIcon = localStorage.getItem('customIcon');

      currentUser = {
        name: savedName ? savedName : payload.name,
        picture: savedIcon ? savedIcon : payload.picture
      };

      document.getElementById('sidebar-name').textContent = currentUser.name;
      document.getElementById('sidebar-icon').src = currentUser.picture;
      document.getElementById('custom-name').value = currentUser.name;
      document.getElementById('custom-icon-url').value = currentUser.picture;

      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');

      // チャンネルのメッセージ読み込みを開始
      startPolling();
    }

    // チャンネル切り替え
    function switchChannel(channelId, webhookUrl, channelName) {
      currentChannelId = channelId;
      currentWebhookUrl = webhookUrl;
      document.getElementById('current-channel-title').textContent = '# ' + channelName;
      document.getElementById('message-input').placeholder = `# ${channelName} にメッセージを送信...`;

      // 選択中のデザインを切り替え
      document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
      event.target.classList.add('active');

      // すぐにメッセージを再取得
      fetchMessages();
    }

    // メッセージの定期取得（ポーリング）
    function startPolling() {
      fetchMessages();
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(fetchMessages, 4000); // 4秒ごとに取得
    }

    async function fetchMessages() {
      try {
        // Vercel上のAPI（/api/messages）を叩く
        const res = await fetch(`/api/messages?channelId=${currentChannelId}`);
        if (!res.ok) return;
        const messages = await res.json();
        
        const container = document.getElementById('chat-messages');
        container.innerHTML = '';

        messages.forEach(msg => {
          const div = document.createElement('div');
          div.className = 'message';
          
          const avatar = msg.author.avatar 
            ? `https://cdn.discordapp.com/avatars/${msg.author.id}/${msg.author.avatar}.png` 
            : 'https://cdn.discordapp.com/embed/avatars/0.png';

          div.innerHTML = `
            <img src="${avatar}" alt="icon">
            <div class="message-content">
              <div class="user-name">${msg.author.username}</div>
              <div class="text">${escapeHtml(msg.content)}</div>
            </div>
          `;
          container.appendChild(div);
        });
      } catch (e) {
        console.error('メッセージ取得失敗', e);
      }
    }

    function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !currentUser) return;

      const payload = {
        username: currentUser.name,
        avatar_url: currentUser.picture,
        content: text
      };

      fetch(currentWebhookUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        input.value = '';
        setTimeout(fetchMessages, 500); // 送信直後に再取得
      })
      .catch(err => alert('送信エラー: ' + err));
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function saveProfile() {
      const newName = document.getElementById('custom-name').value;
      const newIcon = document.getElementById('custom-icon-url').value;
      if (!newName) return alert('名前を入力してください');

      currentUser.name = newName;
      if (newIcon) currentUser.picture = newIcon;

      localStorage.setItem('customName', currentUser.name);
      localStorage.setItem('customIcon', currentUser.picture);

      document.getElementById('sidebar-name').textContent = currentUser.name;
      document.getElementById('sidebar-icon').src = currentUser.picture;
      alert('保存しました！');
    }

    function logout() {
      location.reload();
    }

    function decodeJwtResponse(token) {
      var base64Url = token.split('.')[1];
      var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    function escapeHtml(str) {
      return str.replace(/[&'`<>]/g, function(match) {
        return {
          '&': '&amp;',
          "'": '&#x27;',
          '`': '&#x60;',
          '<': '&lt;',
          '>': '&gt;',
        }[match];
      });
    }
  </script>
</body>
</html>
