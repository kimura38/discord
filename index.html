<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Discord風 Webチャット</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-tertiary: #202225; --bg-secondary: #2f3136; --bg-primary: #36393f;
      --bg-message-hover: #32353b; --text-normal: #dcddde; --text-muted: #8e9297;
      --header-primary: #ffffff; --accent: #5865F2; --accent-hover: #4752C4;
      --danger: #ed4245; --input-bg: #40444b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background-color: var(--bg-primary); color: var(--text-normal); display: flex; height: 100vh; overflow: hidden; }

    /* ログイン画面 */
    #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100vw; height: 100vh; background-color: var(--bg-primary); position: absolute; z-index: 100; }
    .login-box { background: var(--bg-secondary); padding: 40px; border-radius: 8px; text-align: center; }
    
    /* メインレイアウト */
    #app-screen { display: flex; width: 100vw; height: 100vh; }
    .sidebar { width: 240px; background-color: var(--bg-secondary); display: flex; flex-direction: column; }
    .sidebar-header { height: 48px; padding: 0 16px; display: flex; align-items: center; font-weight: bold; border-bottom: 1px solid var(--bg-tertiary); }
    .channel-list { flex-grow: 1; padding: 12px 8px; }
    .channel-item { padding: 6px 8px; margin-bottom: 4px; border-radius: 4px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .channel-item:hover { background-color: rgba(79,84,92,0.32); color: var(--text-normal); }
    .channel-item.active { background-color: rgba(79,84,92,0.6); color: var(--header-primary); }

    /* ユーザーパネル */
    .user-panel { background-color: #292b2f; padding: 0 8px; height: 52px; display: flex; align-items: center; justify-content: space-between; }
    .user-info { display: flex; align-items: center; gap: 8px; cursor: pointer; flex-grow: 1; overflow: hidden; padding: 4px; border-radius: 4px; }
    .user-info:hover { background-color: rgba(79,84,92,0.32); }
    .user-info img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
    .user-text { display: flex; flex-direction: column; overflow: hidden; }
    .user-text .name { font-size: 0.9em; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* チャットエリア */
    .chat-container { flex-grow: 1; display: flex; flex-direction: column; background-color: var(--bg-primary); }
    .chat-header { height: 48px; border-bottom: 1px solid var(--bg-tertiary); display: flex; align-items: center; padding: 0 16px; font-weight: bold; }
    .chat-messages { flex-grow: 1; padding: 16px 0; overflow-y: auto; display: flex; flex-direction: column; }
    .message { display: flex; gap: 16px; padding: 4px 16px; margin-top: 12px; }
    .message:hover { background-color: var(--bg-message-hover); }
    .message img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .message-content { flex-grow: 1; display: flex; flex-direction: column; }
    .message-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
    .message-header .user-name { font-weight: 500; color: var(--header-primary); }
    .message-header .timestamp { font-size: 0.75em; color: var(--text-muted); }
    .message-text { color: var(--text-normal); word-break: break-word; white-space: pre-wrap; }

    .chat-input-area { padding: 0 16px 24px 16px; }
    .chat-input-wrapper { display: flex; align-items: center; background-color: var(--input-bg); border-radius: 8px; padding: 0 16px; gap: 12px; }
    .chat-input-wrapper input { flex-grow: 1; background: transparent; border: none; color: var(--text-normal); outline: none; padding: 14px 0; font-size: 1em; }

    /* 設定モーダル */
    .settings-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); z-index: 200; justify-content: center; align-items: center; }
    .settings-content { background: var(--bg-primary); width: 400px; padding: 24px; border-radius: 8px; }
    .settings-content h3 { margin-top: 0; color: var(--header-primary); }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 8px; font-size: 0.8em; font-weight: bold; color: var(--text-muted); }
    .form-group input[type="text"] { width: 100%; padding: 10px; background: var(--bg-tertiary); border: 1px solid #000; border-radius: 4px; color: var(--text-normal); }
    .btn-save { background: var(--accent); color: white; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer; width: 100%; }
    .btn-close { background: transparent; color: var(--text-muted); border: none; padding: 10px; cursor: pointer; width: 100%; margin-top: 8px; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- ログイン画面 -->
  <div id="login-screen">
    <div class="login-box">
      <h2 style="color:white;">ログイン</h2>
      <div id="g_id_onload"
           data-client_id="1088837422614-mme9r7callo83q6d8uga2ga12pteftjs.apps.googleusercontent.com" 
           data-callback="handleCredentialResponse"
           data-auto_prompt="false">
      </div>
      <div class="g_id_signin" data-type="standard" data-theme="filled_black"></div>
    </div>
  </div>

  <!-- 設定モーダル -->
  <div id="settings-modal" class="settings-modal">
    <div class="settings-content">
      <h3>プロフィール設定</h3>
      <div class="form-group">
        <label>表示名</label>
        <input type="text" id="custom-name" placeholder="新しい名前を入力">
      </div>
      <div class="form-group">
        <label>アイコンを変更 (画像ファイル)</label>
        <input type="file" id="custom-icon-file" accept="image/*" style="color: white;">
      </div>
      <button class="btn-save" onclick="saveProfile()">保存する</button>
      <button class="btn-close" onclick="closeSettings()">キャンセル</button>
    </div>
  </div>

  <!-- メイン画面 -->
  <div id="app-screen" class="hidden">
    <div class="sidebar">
      <div class="sidebar-header">マイサーバー</div>
      <div class="channel-list" id="channel-list"></div>
      
      <!-- ユーザーパネル -->
      <div class="user-panel">
        <!-- ユーザー情報をクリックで設定画面を開く -->
        <div class="user-info" onclick="openSettings()">
          <img id="sidebar-icon" src="">
          <div class="user-text"><span class="name" id="sidebar-name">ユーザー</span></div>
        </div>
        <button onclick="openSettings()" style="background:none; border:none; color:var(--text-muted); cursor:pointer;" title="設定"><i class="fa-solid fa-gear"></i></button>
        <button onclick="logout()" style="background:none; border:none; color:var(--danger); cursor:pointer;" title="ログアウト"><i class="fa-solid fa-right-from-bracket"></i></button>
      </div>
    </div>

    <div class="chat-container">
      <div class="chat-header"><i class="fa-solid fa-hashtag" style="color:var(--text-muted); margin-right:8px;"></i> <span id="current-channel-title">一般</span></div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-area">
        <div class="chat-input-wrapper">
          <input type="text" id="message-input" placeholder="# 一般 にメッセージを送信" onkeypress="handleKeyPress(event)">
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- チャンネル設定 ---
    const channels = [
      { 
        id: '1531217686049329273', // ※もし取得に失敗する場合は、ここを「チャンネルID」に書き換えてください
        name: '一般', 
        webhook: 'https://discord.com/api/webhooks/1538126374131208192/DBVgsnjhQ69ZVmwj1lFdgGHhtEhppOijrhsWzdqdSI2AoS9uLo6D-Kc2OMZ7N1PcJKgT' 
      },
      { 
        id: '1527997892449796178', // サバイバル鯖のチャンネルIDを入れてください
        name: 'サバイバル鯖', 
        webhook: 'https://discord.com/api/webhooks/1538144498045947966/_63dPn0yzv1SThEfCKQW6vdVl0OjHgbr1T2yZ6xUgpThoAS4sYbb4jBda3WAYMfQev-b' 
      }
    ];

    let currentUser = null;
    let currentChannel = channels[0];
    let pollInterval = null;

    // --- Cookie操作用の関数 ---
    function setCookie(name, value, days) {
      const d = new Date();
      d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
      document.cookie = name + "=" + encodeURIComponent(value) + ";expires=" + d.toUTCString() + ";path=/";
    }

    function getCookie(name) {
      const cname = name + "=";
      const ca = document.cookie.split(';');
      for(let i = 0; i < ca.length; i++) {
        let c = ca[i];
        while (c.charAt(0) == ' ') c = c.substring(1);
        if (c.indexOf(cname) == 0) return decodeURIComponent(c.substring(cname.length, c.length));
      }
      return "";
    }

    function deleteCookie(name) {
      document.cookie = name + "=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
    }

    // --- 初期化処理 ---
    window.onload = () => {
      // Cookieからユーザー名を取得
      const savedName = getCookie('discordChatName');
      // 画像は容量が大きいため localStorage から取得
      const savedPic = localStorage.getItem('discordChatPic');

      if (savedName) {
        currentUser = { 
          name: savedName, 
          picture: savedPic || 'https://cdn.discordapp.com/embed/avatars/0.png' 
        };
        loginSuccess();
      }
      renderChannelList();
    };

    function handleCredentialResponse(response) {
      const payload = decodeJwtResponse(response.credential);
      currentUser = { name: payload.name, picture: payload.picture };
      
      // 初回ログイン時にCookieとlocalStorageに保存
      setCookie('discordChatName', currentUser.name, 30);
      localStorage.setItem('discordChatPic', currentUser.picture);
      
      loginSuccess();
    }

    function loginSuccess() {
      document.getElementById('sidebar-name').textContent = currentUser.name;
      document.getElementById('sidebar-icon').src = currentUser.picture;
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');
      switchChannel(currentChannel.id);
    }

    // --- 設定（プロフィール変更） ---
    function openSettings() {
      document.getElementById('custom-name').value = currentUser.name;
      document.getElementById('settings-modal').style.display = 'flex';
    }

    function closeSettings() {
      document.getElementById('settings-modal').style.display = 'none';
      document.getElementById('custom-icon-file').value = '';
    }

    function saveProfile() {
      const newName = document.getElementById('custom-name').value;
      const fileInput = document.getElementById('custom-icon-file');
      
      if (!newName) return alert('表示名を入力してください');
      
      currentUser.name = newName;
      setCookie('discordChatName', newName, 30); // 名前はCookieに保存

      // 画像が選択されている場合
      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          currentUser.picture = e.target.result;
          localStorage.setItem('discordChatPic', currentUser.picture); // 画像はlocalStorageに保存
          updateProfileUI();
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        updateProfileUI();
      }
    }

    function updateProfileUI() {
      document.getElementById('sidebar-name').textContent = currentUser.name;
      document.getElementById('sidebar-icon').src = currentUser.picture;
      closeSettings();
    }

    function logout() {
      deleteCookie('discordChatName');
      localStorage.removeItem('discordChatPic');
      location.reload();
    }

    // --- チャンネル & メッセージ処理 ---
    function renderChannelList() {
      const listDiv = document.getElementById('channel-list');
      listDiv.innerHTML = '';
      channels.forEach(ch => {
        const div = document.createElement('div');
        div.className = `channel-item ${ch.id === currentChannel.id ? 'active' : ''}`;
        div.innerHTML = `<i class="fa-solid fa-hashtag"></i> ${ch.name}`;
        div.onclick = () => switchChannel(ch.id);
        listDiv.appendChild(div);
      });
    }

    function switchChannel(channelId) {
      currentChannel = channels.find(c => c.id === channelId);
      renderChannelList();
      document.getElementById('current-channel-title').textContent = currentChannel.name;
      document.getElementById('message-input').placeholder = `# ${currentChannel.name} にメッセージを送信`;
      
      document.getElementById('chat-messages').innerHTML = '';
      startPolling();
    }

    function startPolling() {
      fetchMessages();
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(fetchMessages, 4000);
    }

    async function fetchMessages() {
      try {
        const res = await fetch(`/api/messages?channelId=${currentChannel.id}`);
        if (!res.ok) return;
        
        const messages = await res.json();
        renderMessages(messages);
      } catch (e) {
        // エラー無視
      }
    }

    function renderMessages(messages) {
      const container = document.getElementById('chat-messages');
      container.innerHTML = ''; 
      messages.slice().reverse().forEach(msg => {
        const div = document.createElement('div');
        div.className = 'message';
        let avatar = 'https://cdn.discordapp.com/embed/avatars/0.png';
        if (msg.author.avatar) {
          avatar = `https://cdn.discordapp.com/avatars/${msg.author.id}/${msg.author.avatar}.png`;
        } else if (msg.author.avatar_url) {
          avatar = msg.author.avatar_url; 
        }
        const d = new Date(msg.timestamp);
        const timeStr = `${d.getMonth()+1}/${d.getDate()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;

        div.innerHTML = `
          <img src="${avatar}">
          <div class="message-content">
            <div class="message-header">
              <span class="user-name">${escapeHtml(msg.author.username)}</span>
              <span class="timestamp">${timeStr}</span>
            </div>
            <div class="message-text">${escapeHtml(msg.content)}</div>
          </div>
        `;
        container.appendChild(div);
      });
      container.scrollTop = container.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !currentUser) return;

      fetch(currentChannel.webhook, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: currentUser.name,
          avatar_url: currentUser.picture,
          content: text
        })
      }).then(() => {
        input.value = '';
        setTimeout(fetchMessages, 500);
      });
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function decodeJwtResponse(token) {
      var base64Url = token.split('.')[1];
      var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&'`<>]/g, match => ({ '&': '&amp;', "'": '&#x27;', '`': '&#x60;', '<': '&lt;', '>': '&gt;' }[match]));
    }
  </script>
</body>
</html>
